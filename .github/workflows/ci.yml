name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.13']
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Migration tests compare the published v0.1 Git fixture.
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install .
      - run: python -m unittest discover -s tests -v
      - run: jev-skills decide tests --input examples/tests.json
      - name: Installed CLI and skill destinations
        run: |
          jev-skills install --agent codex --dest "$RUNNER_TEMP/jev-codex-skills"
          jev-skills install --agent claude --dest "$RUNNER_TEMP/jev-claude-skills"
          jev-skills install --agent codex --dest "$RUNNER_TEMP/jev-codex-skills"
          jev-skills doctor --agent codex --dest "$RUNNER_TEMP/jev-codex-skills" --format human
          jev-skills pick-skill --root "$RUNNER_TEMP/jev-codex-skills" --request 'Choose the first test target'
      - name: Packaged public workflow examples
        run: |
          for workflow in citation ci review tool issue value eval-gap; do
            jev-skills example "$workflow" > "$RUNNER_TEMP/$workflow.json"
            jev-skills decide "$workflow" --input "$RUNNER_TEMP/$workflow.json" > "$RUNNER_TEMP/$workflow-preview.json"
            python -c 'import json,sys; r=json.load(open(sys.argv[1])); assert r["mode"] == "dry_run" and r["network"] is False' "$RUNNER_TEMP/$workflow-preview.json"
          done
