[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jev-skills"
version = "0.1.0"
description = "Jev-powered decision skills for Claude Code and Codex"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "n23eos"}]
keywords = ["jev", "typesafe", "agent-skills", "claude-code", "codex"]

[project.scripts]
jev-skills = "jev_skills.cli:main"

[project.urls]
Repository = "https://github.com/n23eos/jev-skills"
Issues = "https://github.com/n23eos/jev-skills/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
jev_skills = ["skills/*/SKILL.md"]
